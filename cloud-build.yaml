steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/reimbursement-backend', '.']
  
  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/reimbursement-backend']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'reimbursement-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/reimbursement-backend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET_NAME=reimbursement-receipts,MISTRAL_API_KEY=$$MISTRAL_API_KEY,DATABASE_URL=$$DATABASE_URL'
      - '--update-secrets'
      - 'MISTRAL_API_KEY=projects/$PROJECT_ID/secrets/mistral-api-key:latest'
      - 'DATABASE_URL=projects/$PROJECT_ID/secrets/database-url:latest'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1