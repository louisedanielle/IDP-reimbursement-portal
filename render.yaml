databases:
  - name: reimbursement-db
    databaseName: reimbursement
    user: reimbursement_user
    plan: free 

services:
  - type: redis
    name: reimbursement-redis
    plan: free
    ipAllowList: [] 

  - type: web
    name: reimbursement-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reimbursement-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: reimbursement-redis
          property: connectionString
      - key: MISTRAL_API_KEY
        sync: false 
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads

  - type: worker
    name: reimbursement-worker
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "celery -A app.workers.processor worker --loglevel=info"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reimbursement-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: reimbursement-redis
          property: connectionString
      - key: MISTRAL_API_KEY
        sync: false